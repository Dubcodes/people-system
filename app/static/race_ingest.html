<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/static/ui_helpers.js?v=8" defer></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/static/people%20finder%20icon.png">
  <title>Import Races | Race Day People Intelligence</title>
  <style>
    :root { --ink:#1f2933; --muted:#6b7280; --line:rgba(120,98,69,.18); --accent:#b94b2a; --accent-dark:#8f351d; --button:#f1e5d3; --button-active:#315f48; --button-active-dark:#214130; --button-secondary:#2f4858; --bg-a:#ecdfcf; --bg-b:#f6f1e7; --panel:rgba(255,250,242,.95); --shadow:0 16px 38px rgba(50,34,16,.12); }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Georgia,"Times New Roman",serif; color:var(--ink); background:linear-gradient(135deg,var(--bg-a) 0%,var(--bg-b) 100%); min-height:100vh; overflow-x:hidden; }
    .page { width:min(1180px,100%); margin:0 auto; padding:18px; display:grid; gap:16px; }
    .panel { background:var(--panel); border:1px solid var(--line); border-radius:20px; box-shadow:var(--shadow); padding:16px; display:grid; gap:12px; min-width:0; }
    .eyebrow { text-transform:uppercase; letter-spacing:.16em; font-size:11px; color:var(--accent); margin-bottom:4px; }
    h1,h2,h3,p { margin:0; }
    h1 { font-size:24px; }
    h2 { font-size:20px; }
    .topbar,.toolbar,.race-header { display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between; }
    .toolbar,.race-header { justify-content:flex-start; }
    .meeting-grid,.race-list,.race-card,.actions { display:grid; gap:12px; }
    .meeting-grid { grid-template-columns:2fr 1fr 1fr auto auto; align-items:end; }
    .race-header { grid-template-columns:auto minmax(0,1fr) auto; align-items:center; }
    input,textarea,button,.button-link { font:inherit; border-radius:12px; padding:10px 12px; border:1px solid var(--line); }
    input,textarea { background:white; }
    textarea { min-height:118px; resize:vertical; font-family:"Courier New",monospace; }
    button,.button-link { background:var(--button); color:var(--ink); cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; justify-content:center; transition:transform .08s ease, filter .08s ease, box-shadow .08s ease; }
    button:active,.button-link:active { transform:translateY(1px) scale(.98); filter:brightness(.92); box-shadow:inset 0 2px 8px rgba(0,0,0,.16); }
    button.primary,.button-link.primary { background:var(--accent); color:white; border-color:transparent; }
    button.secondary,.button-link.secondary { background:var(--button-secondary); color:white; border-color:transparent; }
    button.ghost,.button-link.ghost { background:transparent; color:var(--ink); border:1px solid var(--line); }
    .race-card { border:1px solid var(--line); border-radius:18px; background:rgba(255,255,255,.58); padding:16px; }
    .race-card.has-data textarea { min-height:46px; max-height:46px; overflow:hidden; color:transparent; caret-color:var(--ink); }
    .race-card.has-data textarea:focus { min-height:260px; max-height:none; color:var(--ink); }
    .pill { display:inline-flex; align-items:center; width:max-content; border:1px solid var(--line); border-radius:999px; padding:6px 10px; color:var(--muted); background:rgba(255,255,255,.7); font-size:13px; }
    .status { border:1px solid var(--line); background:rgba(255,255,255,.65); border-radius:16px; padding:14px; color:var(--muted); }
    .ok { color:#276749; }
    .bad { color:#8a2f24; }
    @media (max-width:820px) { .meeting-grid { grid-template-columns:1fr; } .toolbar,.race-header { align-items:stretch; } button,.button-link { width:100%; } }
  </style>
</head>
<body>
  <div class="page">
    <section class="panel">
      <div class="topbar">
        <div><div class="eyebrow">Import Races</div><h1>Paste each race once</h1></div>
      <div class="toolbar">
        <a class="button-link secondary" href="/">Viewer</a>
        <a class="button-link" href="/ingest">Image Ingest</a>
        <a class="button-link" href="/records">Manage People</a>
        <a class="button-link" href="/horses">Horses</a>
          <a class="button-link primary" href="/race-ingest">Import Races</a>
          <a class="button-link" href="/race-management">Race Management</a>
          <a class="button-link" href="/settings">Settings</a>
          <a class="button-link" href="/help.html" aria-label="Help" title="Help">?</a>
      </div>
      </div>
    </section>

    <section class="panel">
      <div class="meeting-grid">
        <label>
          <div class="eyebrow">Track / Location</div>
          <input id="track" type="text" placeholder="Ashburton" list="track-list" autocomplete="off" required>
          <datalist id="track-list"></datalist>
        </label>
        <label>
          <div class="eyebrow">Race Date</div>
          <input id="race-date" type="date" required>
        </label>
        <label>
          <div class="eyebrow">Source Region</div>
          <select id="source-region"></select>
        </label>
        <button id="preview-all-btn" type="button">Preview Pasted Races</button>
        <button id="import-all-btn" class="primary" type="button">Import Pasted Races</button>
      </div>
      <div id="meeting-status" class="status">Paste Race 1 first. A new race box will appear automatically.</div>
    </section>

    <section class="panel">
      <div class="race-header">
        <div class="eyebrow">Race Data</div>
        <p class="subtle">Boxes collapse after paste so the page stays tidy. Click back into a box to review or edit.</p>
        <button id="add-race-btn" class="ghost" type="button">Add Race Box</button>
      </div>
      <div id="race-list" class="race-list"></div>
    </section>
  </div>

  <script>
    const raceList = document.getElementById('race-list');
    const status = document.getElementById('meeting-status');
    const sourceRegionSelect = document.getElementById('source-region');
    const today = new Date();
    document.getElementById('race-date').value = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;


    function escapeOption(value) {
      return String(value || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;');
    }

    function adminHeaders(extra = {}) {
      return { 'X-Admin-Pin': sessionStorage.getItem('peopleSystemAdminPin') || '', ...extra };
    }

    async function requireMasterPin() {
      const existing = sessionStorage.getItem('peopleSystemAdminPin') || '';
      if (existing) {
        const check = await fetch('/api/admin/master-check', { method: 'POST', headers: { 'X-Admin-Pin': existing } });
        if (check.ok) return true;
        sessionStorage.removeItem('peopleSystemAdminPin');
      }
      const pin = window.prompt('Enter Master PIN to write pasted race data into the live system');
      if (!pin) return false;
      const response = await fetch('/api/admin/master-check', { method: 'POST', headers: { 'X-Admin-Pin': pin } });
      if (!response.ok) {
        alert('That Master PIN was not accepted.');
        return false;
      }
      sessionStorage.setItem('peopleSystemAdminPin', pin);
      return true;
    }

    async function loadTrackSuggestions() {
      try {
        const response = await fetch('/api/suggestions');
        if (!response.ok) return;
        const suggestions = await response.json();
        const tracks = suggestions.tracks || [];
        sourceRegionSelect.innerHTML = (suggestions.regions || [])
          .map(region => `<option value="${escapeOption(region)}">${region}</option>`)
          .join('');
        if (suggestions.default_region) sourceRegionSelect.value = suggestions.default_region;
        document.getElementById('track-list').innerHTML = [...new Set(tracks)]
          .sort((a, b) => a.localeCompare(b))
          .map(track => `<option value="${escapeOption(track)}"></option>`)
          .join('');
      } catch (error) {
        console.warn('Track suggestions failed', error);
      }
    }
    function nextRaceNumber() {
      return raceList.querySelectorAll('.race-card').length + 1;
    }

    function filledCards() {
      return [...raceList.querySelectorAll('.race-card')].filter(card => card.querySelector('textarea').value.trim());
    }

    function updateCardState(card) {
      const text = card.querySelector('textarea').value.trim();
      const summary = card.querySelector('.race-summary');
      card.classList.toggle('has-data', Boolean(text));
      summary.textContent = text ? `${text.split(/\n+/).filter(Boolean).length} lines pasted` : 'Waiting for paste';
      summary.className = text ? 'race-summary pill ok' : 'race-summary pill';
    }

    function ensureEmptyCardAtTop(focusNew = false) {
      const cards = [...raceList.querySelectorAll('.race-card')];
      const first = cards[0];
      if (!first || first.querySelector('textarea').value.trim()) addRaceCard(nextRaceNumber(), focusNew);
    }

    function addRaceCard(number = nextRaceNumber(), focusNew = false) {
      const card = document.createElement('article');
      card.className = 'race-card';
      card.innerHTML = `
        <div class="race-header">
          <h3>Race ${number}</h3>
          <span class="race-summary pill">Waiting for paste</span>
          <button class="ghost clear-race" type="button">Clear</button>
        </div>
        <textarea placeholder="Paste Race ${number} runner data here..." data-race-number="${number}"></textarea>
      `;
      const textarea = card.querySelector('textarea');
      textarea.addEventListener('input', () => { updateCardState(card); ensureEmptyCardAtTop(false); });
      textarea.addEventListener('paste', () => setTimeout(() => { updateCardState(card); ensureEmptyCardAtTop(true); }, 0));
      card.querySelector('.clear-race').addEventListener('click', () => { textarea.value = ''; updateCardState(card); textarea.focus(); });
      raceList.insertBefore(card, raceList.firstChild);
      if (focusNew) {
        card.scrollIntoView({ behavior: 'smooth', block: 'start' });
        textarea.focus();
      }
      return card;
    }

    async function importCard(card) {
      const track = document.getElementById('track').value.trim();
      const raceDate = document.getElementById('race-date').value;
      const sourceRegion = sourceRegionSelect.value;
      const textarea = card.querySelector('textarea');
      const raceNumber = Number(textarea.dataset.raceNumber);
      const rawText = textarea.value.trim();
      if (!rawText) return null;

      const response = await fetch('/api/races/import', {
        method: 'POST',
        headers: adminHeaders({ 'Content-Type': 'application/json' }),
        body: JSON.stringify({ track, race_number: raceNumber, race_date: raceDate, raw_text: rawText, source_region: sourceRegion })
      });
      if (!response.ok) {
        let detail = `Race ${raceNumber} import failed`;
        try {
          const errorBody = await response.json();
          if (errorBody.detail) detail = `Race ${raceNumber}: ${errorBody.detail}`;
        } catch (_) {
          const text = await response.text();
          if (text) detail = `Race ${raceNumber}: ${text}`;
        }
        throw new Error(detail);
      }
      return response.json();
    }

    async function previewCard(card) {
      const track = document.getElementById('track').value.trim() || 'Preview';
      const raceDate = document.getElementById('race-date').value;
      const sourceRegion = sourceRegionSelect.value;
      const textarea = card.querySelector('textarea');
      const raceNumber = Number(textarea.dataset.raceNumber);
      const rawText = textarea.value.trim();
      if (!rawText) return null;

      const response = await fetch('/api/races/preview', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ track, race_number: raceNumber, race_date: raceDate, raw_text: rawText, source_region: sourceRegion })
      });
      if (!response.ok) {
        const errorBody = await response.json().catch(() => ({}));
        throw new Error(errorBody.detail || `Race ${raceNumber} preview failed`);
      }
      const result = await response.json();
      return { raceNumber, ...result };
    }

    document.getElementById('add-race-btn').addEventListener('click', () => addRaceCard(nextRaceNumber(), true));

    document.getElementById('preview-all-btn').addEventListener('click', async () => {
      const raceDate = document.getElementById('race-date').value;
      const cards = filledCards();
      if (!raceDate) { status.textContent = 'Race date is required for preview.'; status.className = 'status bad'; return; }
      if (!cards.length) { status.textContent = 'Paste at least one race before previewing.'; status.className = 'status bad'; return; }
      status.textContent = `Previewing ${cards.length} pasted race${cards.length === 1 ? '' : 's'}...`;
      status.className = 'status';
      try {
        const previews = [];
        for (const card of cards) previews.push(await previewCard(card));
        const runners = previews.reduce((total, item) => total + (item.runner_count || 0), 0);
        const scratched = previews.reduce((total, item) => total + (item.scratched_count || 0), 0);
        status.textContent = `Preview OK: ${previews.length} race${previews.length === 1 ? '' : 's'}, ${runners} runners${scratched ? `, ${scratched} scratched` : ''}. No data was written.`;
        status.className = 'status ok';
      } catch (error) {
        status.textContent = error.message;
        status.className = 'status bad';
      }
    });

    document.getElementById('import-all-btn').addEventListener('click', async () => {
      const track = document.getElementById('track').value.trim();
      const raceDate = document.getElementById('race-date').value;
      const cards = filledCards();
      if (!track || !raceDate) { status.textContent = 'Track/location and date are required.'; status.className = 'status bad'; return; }
      if (!cards.length) { status.textContent = 'Paste at least one race before importing.'; status.className = 'status bad'; return; }
      if (!window.confirm(`Import ${cards.length} pasted race${cards.length === 1 ? '' : 's'} into the live system?\n\nPreview first if you have not already checked the runner counts.`)) return;
      if (!await requireMasterPin()) { status.textContent = 'Import cancelled. Master PIN is required to write pasted race data.'; status.className = 'status bad'; return; }

      status.textContent = `Importing ${cards.length} race${cards.length === 1 ? '' : 's'}...`;
      status.className = 'status';
      const results = [];
      try {
        for (const card of cards) results.push(await importCard(card));
      } catch (error) {
        status.textContent = error.message;
        status.className = 'status bad';
        return;
      }

      const entries = results.reduce((total, item) => total + item.entries_created, 0);
      const people = results.reduce((total, item) => total + item.people_created, 0);
      const horses = results.reduce((total, item) => total + item.horses_created, 0);
      const scratched = results.flatMap(item => item.scratched || []);
      status.textContent = `Imported ${results.length} race${results.length === 1 ? '' : 's'}, ${entries} runners. New people: ${people}. New horses: ${horses}.${scratched.length ? ` Scratched skipped: ${scratched.join(', ')}.` : ''}`;
      status.className = 'status ok';
    });

    loadTrackSuggestions();
    addRaceCard(1);
  </script>
</body>
</html>
